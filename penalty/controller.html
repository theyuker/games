<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#08160f">
<title>פנדלים – שלט</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;800&display=swap">
<style>
  :root { --bg:#08160f; --panel:#0f241a; --line:#24493a; --chalk:#eef3ea; --muted:#9db3a6; --led:#ffcf3a; --save:#ff5d5d; --c:#4fd1c5;
          --display:"Secular One","Arial Hebrew",system-ui,sans-serif; --body:"Assistant","Segoe UI",system-ui,sans-serif; color-scheme:dark; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; touch-action:manipulation; }
  body { background:radial-gradient(120% 70% at 50% 0%, #1b3a2b 0%, var(--bg) 60%); background-color:var(--bg); color:var(--chalk);
         font-family:var(--body); font-size:17px; user-select:none; -webkit-user-select:none;
         padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); }
  .app { max-width:460px; height:100%; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  header { display:flex; align-items:center; gap:10px; border-bottom:3px solid var(--c); padding-bottom:10px; }
  header .sw { width:18px; height:18px; border-radius:5px; background:var(--c); flex:none; }
  header .nm { font-family:var(--display); font-size:1.3rem; color:var(--c); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header .sc { font-family:"Courier New",monospace; font-weight:700; font-size:1.6rem; color:var(--led); }
  header .rd { font-size:.8rem; color:var(--muted); }
  h1 { font-family:var(--display); font-weight:400; color:var(--led); margin:0; font-size:2rem; text-align:center; }
  .msg { text-align:center; font-size:1.15rem; line-height:1.5; }
  .msg b { color:var(--led); }
  .big { font-family:var(--display); font-size:1.7rem; text-align:center; }
  .role { align-self:center; font-weight:800; font-size:1.1rem; padding:6px 18px; border-radius:999px; background:#1d3b2d; }
  .role.k { background:var(--led); color:#1a1405; }
  .pad { flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; direction:ltr; min-height:180px; max-height:340px; }
  .pad button { font:inherit; color:var(--chalk); border:2px solid var(--line); border-bottom-width:6px; border-radius:18px; background:#163226;
                display:grid; place-items:center; align-content:center; gap:6px; cursor:pointer; }
  .pad button .ar { font-size:2.6rem; line-height:1; }
  .pad button .lb { font-family:var(--display); font-size:1.3rem; }
  .pad button:active { transform:translateY(4px); border-bottom-width:2px; }
  .pad button.sel { background:var(--led); color:#1a1405; border-color:var(--led); }
  .pad button:disabled { opacity:.4; }
  .pad button.sel:disabled { opacity:1; }
  form { display:grid; gap:12px; }
  label { color:var(--muted); font-size:.9rem; }
  input { font:inherit; font-size:1.3rem; padding:12px 14px; border-radius:12px; border:2px solid var(--line); background:#0a1a12; color:var(--chalk); width:100%; text-align:center; }
  input:focus { outline:2px solid var(--led); }
  #codeIn { font-family:"Courier New",monospace; font-weight:700; letter-spacing:.3em; text-transform:uppercase; direction:ltr; }
  .btn { font:inherit; font-weight:800; font-size:1.25rem; padding:14px; border-radius:14px; border:0; background:var(--led); color:#1a1405; cursor:pointer; width:100%; }
  .btn.ghost { background:transparent; color:var(--chalk); border:1px solid var(--line); font-size:1rem; padding:10px; }
  .err { color:var(--save); text-align:center; font-weight:700; min-height:1.4em; }
  .spacer { flex:1; }
  .ball { font-size:4rem; text-align:center; animation:bob 1.2s ease-in-out infinite alternate; }
  @keyframes bob { to { transform:translateY(-10px); } }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="app">
  <header id="hdr" hidden><span class="sw"></span><span class="nm" id="hName"></span><span class="rd" id="hRound"></span><span class="sc" id="hScore"></span></header>

  <!-- join -->
  <section id="vJoin">
    <h1>⚽ פנדלים</h1>
    <p class="msg">הטלפון שלך הוא השלט. בוחרים כאן בסתר, ורואים את הבעיטה על המסך הגדול.</p>
    <form id="joinForm">
      <label for="nameIn">השם שלך</label>
      <input id="nameIn" maxlength="14" autocomplete="off" required>
      <label for="codeIn">קוד החדר (מופיע על המסך הגדול)</label>
      <input id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" required>
      <button class="btn" type="submit">הצטרפות</button>
    </form>
    <div class="err" id="err"></div>
  </section>

  <!-- everything after joining -->
  <section id="vMain" hidden style="display:flex;flex-direction:column;gap:14px;flex:1;min-height:0">
    <div class="role" id="role" hidden></div>
    <div class="msg" id="msg"></div>
    <div class="pad" id="pad" hidden>
      <button data-dir="left"><span class="ar">⬅️</span><span class="lb">שמאל</span></button>
      <button data-dir="mid"><span class="ar">⬆️</span><span class="lb">אמצע</span></button>
      <button data-dir="right"><span class="ar">➡️</span><span class="lb">ימין</span></button>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="nextBtn" hidden></button>
    <button class="btn ghost" id="leaveBtn">יציאה מהחדר</button>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const ROOM_PREFIX = 'theyuker-penalty-';
const DIR_HE = { left: 'שמאל', mid: 'אמצע', right: 'ימין' };
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
// a stable id per phone, so a phone that drops and reconnects gets its place back
let pid = store.get('penalty-pid');
if (!pid) { pid = Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('penalty-pid', pid); }

let peer = null, conn = null, code = '', name = '', state = null, wantOpen = false, retryTimer = 0;

$('nameIn').value = store.get('penalty-player-name') || '';
const urlRoom = new URLSearchParams(location.search).get('room');
$('codeIn').value = (urlRoom || '').toUpperCase().slice(0, 4);

function show(join) { $('vJoin').hidden = !join; $('vMain').hidden = join; $('hdr').hidden = join; }
function err(t) { $('err').textContent = t || ''; }

$('joinForm').onsubmit = e => {
  e.preventDefault();
  name = $('nameIn').value.trim();
  code = $('codeIn').value.trim().toUpperCase();
  if (!name || code.length !== 4) { err('צריך שם וקוד בן 4 תווים'); return; }
  store.set('penalty-player-name', name);
  err('');
  connect();
};

function connect() {
  wantOpen = true;
  clearTimeout(retryTimer);
  setMsg('מתחבר למסך…');
  show(false);
  $('hName').textContent = name;
  if (typeof Peer === 'undefined') { show(true); err('לא ניתן לטעון את רכיב החיבור – בדקו אינטרנט'); return; }
  if (!peer || peer.destroyed) {
    peer = new Peer();
    peer.on('error', e => {
      if (e.type === 'peer-unavailable') { leave(); err('לא נמצא חדר עם הקוד הזה. בדקו את הקוד על המסך.'); }
      else scheduleRetry();
    });
    peer.on('disconnected', () => { try { peer.reconnect(); } catch {} });
  }
  const open = () => {
    conn = peer.connect(ROOM_PREFIX + code, { reliable: true });
    conn.on('open', () => conn.send({ t: 'hello', name, pid }));
    conn.on('data', onState);
    conn.on('close', () => { if (wantOpen) { setMsg('החיבור נותק… מתחבר שוב'); scheduleRetry(); } });
  };
  if (peer.open) open(); else peer.once('open', open);
}
function scheduleRetry() { if (!wantOpen) return; clearTimeout(retryTimer); retryTimer = setTimeout(connect, 2000); }
function leave() {
  wantOpen = false; clearTimeout(retryTimer);
  try { conn && conn.close(); } catch {}
  show(true);
}
$('leaveBtn').onclick = leave;

function setMsg(html) { $('msg').innerHTML = html; }
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let lastView = '';
function onState(v) {
  if (v.t === 'full') { leave(); err('החדר מלא – כל המקומות במשחק כבר תפוסים'); return; }
  if (v.t !== 'state') return;
  state = v;
  document.documentElement.style.setProperty('--c', v.color);
  $('hName').textContent = v.name;
  $('hScore').textContent = v.goals != null ? v.goals : '';
  $('hRound').textContent = v.round || '';
  const role = $('role'), pad = $('pad'), next = $('nextBtn');
  role.hidden = !v.role; role.className = 'role' + (v.role === 'k' ? ' k' : '');
  role.textContent = v.role === 'k' ? '⚽ אתה בועט' : v.role === 'g' ? '🧤 אתה בשער' : '';
  pad.hidden = v.view !== 'choose';
  next.hidden = true;
  pad.querySelectorAll('button').forEach(b => { b.disabled = !!v.picked; if (!v.picked) b.classList.remove('sel'); });

  if (v.view === 'lobby') {
    setMsg('<div class="ball">⚽</div><div class="big">מחובר!</div>' + (v.ready ? 'כולם כאן.' : 'מחכים לשאר השחקנים…'));
    next.hidden = !v.ready; next.textContent = 'מתחילים! ▶';
  } else if (v.view === 'out') {
    setMsg('אתה מחובר, אבל לא משתתף במשחק הזה.<br>שנו את סוג המשחק על המסך כדי להצטרף.');
  } else if (v.view === 'choose') {
    setMsg(v.picked ? '✅ הבחירה נעולה<br>מחכים ל<b>' + esc(v.vs) + '</b>…'
                    : (v.role === 'k' ? 'לאן לבעוט? <b>' + esc(v.vs) + '</b> בשער' : 'לאן לזנק? <b>' + esc(v.vs) + '</b> בועט'));
    if (lastView !== 'choose' && navigator.vibrate) navigator.vibrate(120);   // your turn
  } else if (v.view === 'rest') {
    setMsg('😌 נח בבעיטה הזאת<br>תסתכל על המסך!');
  } else if (v.view === 'watch') {
    setMsg('<div class="big">👀 תסתכל על המסך!</div>');
  } else if (v.view === 'result') {
    setMsg('<div class="big">' + esc(v.result) + '</div>');
    next.hidden = false; next.textContent = 'לבעיטה הבאה ▶';
  } else if (v.view === 'over') {
    setMsg('<div class="big">' + (v.place === 1 ? '🏆 ניצחת!' : 'סיימת במקום ' + v.place) + '</div>' + (v.place === 1 ? '' : 'המנצח: <b>' + esc(v.winner) + '</b>'));
    next.hidden = false; next.textContent = 'משחק חוזר 🔄';
  }
  lastView = v.view;
}

$('pad').addEventListener('click', e => {
  const b = e.target.closest('button[data-dir]');
  if (!b || b.disabled || !conn || !conn.open) return;
  $('pad').querySelectorAll('button').forEach(x => { x.disabled = true; x.classList.toggle('sel', x === b); });
  setMsg('✅ בחרת <b>' + DIR_HE[b.dataset.dir] + '</b>');
  conn.send({ t: 'pick', dir: b.dataset.dir });
});
$('nextBtn').onclick = () => { if (conn && conn.open) conn.send({ t: 'next' }); };

// keep the phone awake while in a room
let wake = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wake && !$('vMain').hidden) wake = await navigator.wakeLock.request('screen'); wake && wake.addEventListener('release', () => wake = null); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); if (wantOpen && (!conn || !conn.open)) connect(); } });
document.addEventListener('click', keepAwake);

if (urlRoom && $('nameIn').value) $('nameIn').focus();
</script>
</body>
</html>
