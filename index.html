<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המשחקים שלי</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:"Rubik","Segoe UI",Arial,sans-serif; color:#1e1b3a; padding:24px 16px;
         background:linear-gradient(135deg,#8f6bff 0%,#5b8cff 50%,#2fd3c7 100%); background-attachment:fixed; }
  h1 { text-align:center; color:#fff; font-size:38px; margin:10px 0 28px; text-shadow:0 4px 20px rgba(40,20,120,.35); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; max-width:900px; margin:0 auto; }
  a.game { display:block; text-decoration:none; color:inherit; background:#ffffffee; border-radius:24px; padding:24px;
           box-shadow:0 16px 40px rgba(40,20,120,.25); transition:transform .15s; }
  a.game:hover { transform:translateY(-4px); }
  .icon { font-size:48px; }
  .name { font-size:24px; font-weight:800; margin:8px 0 4px; }
  .desc { color:#6f6a8f; font-size:16px; }
</style>
</head>
<body>
  <h1>🎮 המשחקים שלי</h1>
  <div class="grid">
    <!-- every new game: add a card here -->
    <a class="game" href="multiplication-game/">
      <div class="icon">🚀</div>
      <div class="name">מרוץ החשבון</div>
      <div class="desc">כפל וחיבור בקול, נגד השעון, עם טבלת שיאים</div>
    </a>
    <a class="game" href="snakes-ladders/">
      <div class="icon">🐍</div>
      <div class="name">סולמות ונחשים</div>
      <div class="desc">2–5 שחקנים, שלוש קוביות, עם תרגילי חיבור או בלי</div>
    </a>
    <a class="game" href="penalty/">
      <div class="icon">⚽</div>
      <div class="name">פנדלים מ-11 מטר</div>
      <div class="desc">מול המחשב, 2 או 3 שחקנים – במקלדת, או כל אחד מהטלפון שלו</div>
    </a>
  </div>
</body>
</html>
