<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c4cf5">
<meta name="mobile-web-app-capable" content="yes">
<title>לוח הכפל בקול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#1e1b3a; --muted:#6f6a8f; --card:#ffffffee;
    --purple:#6c4cf5; --pink:#ff4f8b; --orange:#ff9f1c; --green:#18c27a; --red:#ff4757; --gold:#ffc83d;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { touch-action:manipulation; }
  body {
    margin:0; min-height:100vh; color:var(--ink); font-family:"Rubik","Segoe UI",Arial,sans-serif;
    background: radial-gradient(circle at 15% 20%, #ffd6e8 0, transparent 40%),
                radial-gradient(circle at 85% 80%, #c9f1ff 0, transparent 45%),
                linear-gradient(135deg, #8f6bff 0%, #5b8cff 50%, #2fd3c7 100%);
    background-attachment: fixed;
  }
  /* floating background numbers */
  .bg-num { position:fixed; font-weight:800; color:#ffffff22; pointer-events:none; user-select:none;
            animation: drift linear infinite; z-index:0; }
  @keyframes drift { from { transform:translateY(110vh) rotate(0deg); } to { transform:translateY(-20vh) rotate(360deg); } }

  /* RTL grid: first column is on the right, so the board sits on the left */
  .layout { position:relative; z-index:1; display:grid; grid-template-columns: 1fr 320px; gap:24px;
            max-width:1100px; margin:0 auto; padding:24px 16px; min-height:100vh; align-items:start; }
  .panel { background:var(--card); backdrop-filter:blur(8px); border-radius:28px;
           box-shadow:0 20px 60px rgba(40,20,120,.25); padding:28px 24px; }
  h1 { margin:0; font-size:34px; font-weight:800; text-align:center;
       background:linear-gradient(90deg,var(--purple),var(--pink),var(--orange)); -webkit-background-clip:text; color:transparent; }
  .sub { text-align:center; color:var(--muted); margin:6px 0 20px; font-size:17px; }

  /* intro */
  .intro { text-align:center; }
  .rules { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:16px 0 24px; }
  .rule { background:#f3efff; border-radius:16px; padding:12px 14px; font-size:15px; width:150px; }
  .rule span { display:block; font-size:30px; margin-bottom:4px; }
  input[type=text] { font:inherit; font-size:22px; padding:12px 16px; border-radius:14px; border:3px solid #e3dcff;
                     width:100%; max-width:300px; text-align:center; outline:none; }
  input[type=text]:focus { border-color:var(--purple); }
  .btn { font:inherit; font-size:24px; font-weight:800; padding:14px 44px; border:0; border-radius:18px; cursor:pointer; color:#fff;
         background:linear-gradient(135deg,var(--pink),var(--orange)); box-shadow:0 8px 0 #c93a6a; margin-top:18px;
         transition:transform .1s, box-shadow .1s; }
  .btn:active { transform:translateY(6px); box-shadow:0 2px 0 #c93a6a; }
  .btn.small { font-size:16px; padding:8px 18px; box-shadow:0 4px 0 #c93a6a; background:linear-gradient(135deg,#9b8cff,var(--purple)); box-shadow:0 4px 0 #4b33b8; }
  .err { color:var(--red); margin-top:14px; font-weight:600; }
  .modes { display:flex; gap:10px; justify-content:center; margin:0 0 18px; }
  .mode { font:inherit; font-size:19px; font-weight:600; padding:12px 18px; border-radius:18px; border:3px solid #e3dcff;
          background:#fff; color:var(--ink); cursor:pointer; flex:1; max-width:200px; }
  .mode small { display:block; font-size:13px; font-weight:400; color:var(--muted); }
  .mode.on { border-color:var(--purple); background:#f3efff; box-shadow:0 0 0 3px #6c4cf533; }
  .players-label { color:var(--muted); font-size:15px; margin:16px 0 8px; }
  .players { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:460px; margin:0 auto; }
  .chip { font:inherit; font-size:17px; padding:8px 16px; border-radius:999px; border:2px solid #e3dcff; background:#f6f4ff;
          color:var(--ink); cursor:pointer; transition:transform .1s; }
  .chip:hover { transform:translateY(-2px); border-color:var(--purple); }
  .chip.on { background:linear-gradient(135deg,#9b8cff,var(--purple)); color:#fff; border-color:transparent; }
  .result-actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; align-items:center; }
  .btn.alt { background:linear-gradient(135deg,#9b8cff,var(--purple)); box-shadow:0 8px 0 #4b33b8; }
  .btn.alt:active { box-shadow:0 2px 0 #4b33b8; }

  /* game */
  .hud { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .stat { text-align:center; min-width:90px; }
  .stat b { display:block; font-size:40px; font-weight:800; line-height:1; }
  .stat small { color:var(--muted); font-size:14px; }
  .stat.good b { color:var(--green); } .stat.streak b { color:var(--orange); }
  .timer { position:relative; width:130px; height:130px; flex:none; }
  .timer svg { transform:rotate(-90deg); }
  .timer .t { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:800; }
  .timer.hurry .t { color:var(--red); animation:beat .5s infinite; }
  @keyframes beat { 50% { transform:scale(1.15); } }

  .qbox { position:relative; margin:22px 0 10px; border-radius:24px; padding:26px 10px;
          background:linear-gradient(135deg,#fff7d6,#ffe3f0); text-align:center; overflow:hidden; }
  .question { font-size:84px; font-weight:800; direction:ltr; letter-spacing:2px; }
  .question.pop { animation:pop .35s ease-out; }
  @keyframes pop { 0% { transform:scale(.6); opacity:0; } 70% { transform:scale(1.08); } 100% { transform:scale(1); opacity:1; } }
  .qbox.good { animation:flashG .5s; } .qbox.bad { animation:shake .4s; }
  @keyframes flashG { 30% { background:#c8f7df; } }
  @keyframes shake { 20%,60% { transform:translateX(-10px); background:#ffd9dd; } 40%,80% { transform:translateX(10px); } }
  .plus { position:absolute; top:20px; left:50%; font-size:36px; font-weight:800; color:var(--green); animation:rise .8s forwards; }
  @keyframes rise { to { transform:translate(-50%,-70px); opacity:0; } }
  .heard { min-height:30px; font-size:20px; color:var(--muted); text-align:center; }
  .feedback { min-height:42px; font-size:28px; font-weight:800; text-align:center; }
  .feedback.good { color:var(--green); } .feedback.bad { color:var(--red); }
  .mic { display:flex; align-items:center; justify-content:center; gap:8px; color:var(--muted); }
  .dot { width:14px; height:14px; border-radius:50%; background:#c9c3e6; }
  .dot.on { background:var(--red); box-shadow:0 0 0 0 #ff475788; animation:ring 1.2s infinite; }
  @keyframes ring { to { box-shadow:0 0 0 14px #ff475700; } }
  .actions { text-align:center; }
  .target { text-align:center; margin-top:14px; font-size:16px; color:var(--muted); }
  .target b { color:var(--orange); }

  /* result */
  .result { text-align:center; }
  .big { font-size:96px; font-weight:800; color:var(--purple); line-height:1; margin:10px 0; }
  .record { font-size:34px; font-weight:800; color:var(--orange); animation:beat .8s infinite; }

  /* leaderboard */
  .board h2 { margin:0 0 14px; text-align:center; font-size:26px; }
  .board ol { list-style:none; margin:0; padding:0; }
  .board li { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:14px; margin-bottom:6px; background:#f6f4ff; font-size:18px; }
  .board li .pos { width:32px; text-align:center; font-weight:800; color:var(--muted); font-size:18px; }
  .board li .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .board li .sc { font-weight:800; font-size:22px; color:var(--purple); }
  .board li.first { background:linear-gradient(135deg,#fff1b8,#ffd76a); font-size:20px; }
  .board li.first .pos, .board li:nth-child(2) .pos, .board li:nth-child(3) .pos { font-size:24px; }
  .board li.mine { outline:3px solid var(--pink); animation:pop .5s; }
  .board .empty { color:var(--muted); text-align:center; padding:20px 0; }
  .board .note { color:var(--muted); font-size:13px; text-align:center; margin-top:10px; }

  .confetti { position:fixed; top:-20px; width:10px; height:16px; z-index:50; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }

  [hidden] { display:none !important; }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; gap:16px; min-height:100dvh; align-content:start;
              padding: max(12px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom)); }
    .question { font-size:64px; }
    .timer { width:100px; height:100px; } .timer svg { width:100px; height:100px; } .timer .t { font-size:34px; }
    .stat b { font-size:32px; } .stat { min-width:70px; }
  }
  @media (max-width: 480px) {
    .panel { border-radius:22px; padding:18px 14px; }
    h1 { font-size:26px; } .sub { font-size:15px; margin-bottom:12px; }
    .rules { gap:8px; margin:10px 0 16px; flex-wrap:nowrap; }
    .rule { width:auto; flex:1; font-size:13px; padding:10px 6px; } .rule span { font-size:24px; }
    .btn { font-size:21px; padding:14px 0; width:100%; max-width:320px; }
    .btn.small { width:auto; padding:8px 18px; }
    .timer { width:88px; height:88px; } .timer svg { width:88px; height:88px; } .timer .t { font-size:30px; }
    .stat b { font-size:30px; } .stat { min-width:60px; }
    .qbox { margin:14px 0 8px; padding:20px 6px; }
    .question { font-size:clamp(44px, 15vw, 60px); }
    .feedback { font-size:23px; min-height:36px; } .heard { font-size:17px; }
    .big { font-size:76px; } .record { font-size:26px; }
    .board h2 { font-size:22px; } .board li { font-size:16px; padding:7px 10px; }
  }
</style>
</head>
<body>
<div class="layout">
  <main class="panel">
    <h1>מרוץ החשבון 🚀</h1>
    <div class="sub">כמה תרגילים תספיק לפתור בדקה אחת?</div>

    <!-- intro -->
    <section class="intro" id="intro">
      <div class="rules">
        <div class="rule"><span>⏱️</span>יש לך 60 שניות</div>
        <div class="rule"><span>🎤</span>עונים בקול</div>
        <div class="rule"><span>🏆</span>שוברים את השיא!</div>
      </div>
      <div class="players-label">מה משחקים?</div>
      <div class="modes">
        <button class="mode" data-mode="mul">✖️ כפל<small>מכפול 1 עד כפול 10</small></button>
        <button class="mode" data-mode="add">➕ חיבור<small>מספרים בין 2 ל-7</small></button>
        <button class="mode" data-mode="add6">➕ חיבור<small>מספרים עד 6</small></button>
      </div>
      <div class="modes" id="timingBox" hidden>
        <button class="mode timing" data-untimed="0">⏱️ על זמן<small>דקה אחת, נכנס לטבלה</small></button>
        <button class="mode timing" data-untimed="1">♾️ בלי זמן<small>תרגול חופשי</small></button>
      </div>
      <input type="text" id="nameInput" maxlength="16" placeholder="איך קוראים לך?" autocomplete="off">
      <div id="playersBox" hidden>
        <div class="players-label">או בחר שחקן:</div>
        <div class="players" id="players"></div>
      </div>
      <br>
      <button class="btn" id="startBtn">יאללה, מתחילים!</button>
      <div class="err" id="err"></div>
    </section>

    <!-- game -->
    <section id="game" hidden>
      <div class="hud">
        <div class="stat good"><b id="right">0</b><small>נכונות</small></div>
        <div class="timer" id="timer">
          <svg width="130" height="130" viewBox="0 0 130 130">
            <circle cx="65" cy="65" r="56" fill="none" stroke="#ece8ff" stroke-width="12"/>
            <circle id="ring" cx="65" cy="65" r="56" fill="none" stroke="url(#grad)" stroke-width="12" stroke-linecap="round"
                    stroke-dasharray="351.86" stroke-dashoffset="0"/>
            <defs><linearGradient id="grad"><stop offset="0" stop-color="#ff4f8b"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient></defs>
          </svg>
          <div class="t" id="timeText">60</div>
        </div>
        <div class="stat streak"><b id="streak">0</b><small>רצף 🔥</small></div>
      </div>
      <div class="qbox" id="qbox"><div class="question" id="question"></div></div>
      <div class="heard" id="heard"></div>
      <div class="feedback" id="feedback"></div>
      <div class="mic"><span class="dot" id="dot"></span><span>מקשיב...</span></div>
      <div class="target" id="target"></div>
      <div class="actions">
        <button class="btn small" id="skipBtn">דלג ⏭️</button>
        <button class="btn small" id="pauseBtn">עצור ⏸️</button>
        <button class="btn small" id="restartBtn">מההתחלה 🔄</button>
        <button class="btn small" id="finishBtn" hidden>סיימתי ✅</button>
      </div>
    </section>

    <!-- paused -->
    <section class="result" id="paused" hidden>
      <div style="font-size:60px">⏸️</div>
      <div style="font-size:28px;font-weight:800">המשחק בהפסקה</div>
      <div style="font-size:19px;color:var(--muted);margin-top:8px"><span id="pausedTimeBox">נשארו <b id="pausedTime">0</b> שניות · </span><b id="pausedScore">0</b> תשובות נכונות</div>
      <div class="result-actions">
        <button class="btn" id="resumeBtn">המשך ▶️</button>
        <button class="btn alt" id="pausedRestartBtn">מההתחלה 🔄</button>
      </div>
      <button class="btn small" id="menuBtn">יציאה לתפריט 🏠</button>
    </section>

    <!-- result -->
    <section class="result" id="result" hidden>
      <div style="font-size:24px" id="resultTitle">נגמר הזמן! ⏰</div>
      <div class="big" id="finalScore">0</div>
      <div style="font-size:20px;color:var(--muted)" id="resultSub">תשובות נכונות בדקה</div>
      <div class="record" id="recordMsg" hidden>🏆 שברת את השיא! 🏆</div>
      <div id="placeMsg" style="font-size:22px;margin-top:10px;font-weight:600"></div>
      <div class="result-actions">
        <button class="btn" id="againBtn">עוד סיבוב!</button>
        <button class="btn alt" id="otherBtn">👥 שחקן אחר</button>
      </div>
    </section>
  </main>

  <aside class="panel board">
    <h2 id="boardTitle">🏆 טבלת השיאים</h2>
    <ol id="board"></ol>
    <div class="note">הכי הרבה תשובות נכונות בדקה</div>
  </aside>
</div>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const $ = id => document.getElementById(id);
const GAME_SECONDS = 60, RING = 351.86, BOARD_SIZE = 10;
const MODES = {
  mul: { name: 'כפל',   sym: '×', min: 1, max: 10, board: 'mult-board', calc: (x, y) => x * y },
  add: { name: 'חיבור', sym: '+', min: 2, max: 7,  board: 'add-board',  calc: (x, y) => x + y },
  add6: { name: 'חיבור עד 6', sym: '+', min: 1, max: 6, board: 'add6-board', calc: (x, y) => x + y },
};
const FIXED_PLAYERS = ['תומר'];   // always offered on the start screen
let mode = 'mul';
let untimed = false;   // free practice: no clock, not saved to the board (addition only)
try { untimed = localStorage.getItem('mult-untimed') === '1'; } catch {}
const isUntimed = () => untimed && mode !== 'mul';
try { if (MODES[localStorage.getItem('mult-mode')]) mode = localStorage.getItem('mult-mode'); } catch {}
const answerOf = () => MODES[mode].calc(a, b);
let a, b, rec, running = false, locked = false, right = 0, wrong = 0, streak = 0, last = '', endAt = 0, myEntry = null;

// ---- leaderboard (kept in this browser) ----
function loadBoard(m = mode) { try { return JSON.parse(localStorage.getItem(MODES[m].board) || '[]'); } catch { return []; } }
function saveBoard(list) { try { localStorage.setItem(MODES[mode].board, JSON.stringify(list)); } catch {} }
function renderBoard() {
  const list = loadBoard(), ol = $('board');
  $('boardTitle').textContent = `🏆 שיאים – ${MODES[mode].name}`;
  ol.innerHTML = '';
  if (!list.length) { ol.innerHTML = '<div class="empty">עוד אין שיאים.<br>תהיה הראשון! 🌟</div>'; return; }
  const medals = ['🥇','🥈','🥉'];
  list.forEach((e, i) => {
    const li = document.createElement('li');
    if (i === 0) li.className = 'first';
    if (myEntry && e.t === myEntry.t) li.classList.add('mine');
    li.innerHTML = `<span class="pos">${medals[i] || i + 1}</span><span class="nm"></span><span class="sc">${e.score}</span>`;
    li.querySelector('.nm').textContent = e.name;
    ol.appendChild(li);
  });
}
// a new score only passes someone if it's strictly higher, so the record holder stays first on a tie
function addToBoard(name, score) {
  const list = loadBoard(), entry = { name, score, t: Date.now() };
  const oldTop = list.length ? list[0].score : -1;
  list.push(entry);
  list.sort((x, y) => y.score - x.score || x.t - y.t);
  const kept = list.slice(0, BOARD_SIZE), place = kept.indexOf(entry) + 1;
  saveBoard(kept);
  return { entry: place ? entry : null, place, record: place === 1 && score > oldTop && score > 0 };
}

// ---- Hebrew spoken number -> integer ----
const WORDS = {
  'אפס':0,
  'אחת':1,'אחד':1,
  'שתיים':2,'שתים':2,'שניים':2,'שנים':2,'שתי':2,'שני':2,
  'שלוש':3,'שלושה':3,'שלש':3,'שלשה':3,
  'ארבע':4,'ארבעה':4,
  'חמש':5,'חמישה':5,'חמשה':5,
  'שש':6,'שישה':6,'ששה':6,'שיש':6,
  'שבע':7,'שבעה':7,
  'שמונה':8,
  'תשע':9,'תשעה':9,
  'עשר':10,'עשרה':10,
  'עשרים':20,'שלושים':30,'שלשים':30,'ארבעים':40,'חמישים':50,'חמשים':50,
  'שישים':60,'ששים':60,'שבעים':70,'שמונים':80,'תשעים':90,'מאה':100
};
// Every number said, kept apart: "שלוש שלוש" is [3, 3], not 6.
// Words join into one number only as "עשרים ושלוש" (tens + ו + unit) or "שלוש עשרה" (unit + עשרה).
const TEN_WORDS = ['עשר', 'עשרה'];
function parseNumbers(text) {
  const nums = [];
  for (const d of text.match(/\d+/g) || []) {
    nums.push(parseInt(d, 10));
    const rep = d.match(/^(\d+?)\1+$/);   // "3 3" can come back as "33"
    if (rep) nums.push(parseInt(rep[1], 10));
  }
  let cur = null, kind = null;
  const flush = () => { if (cur !== null) nums.push(cur); cur = kind = null; };
  for (let w of text.replace(/[^֐-׿\s]/g, ' ').split(/\s+/)) {
    if (!w) continue;
    let joined = false;
    if (!(w in WORDS) && w.startsWith('ו') && (w.slice(1) in WORDS)) { w = w.slice(1); joined = true; }
    if (!(w in WORDS)) { flush(); continue; }
    const v = WORDS[w];
    if (TEN_WORDS.includes(w)) {
      if (kind === 'unit') { cur += 10; flush(); } else { flush(); nums.push(10); }
    } else if (v < 10) {
      if (kind === 'tens' && joined) { cur += v; flush(); }
      else { flush(); cur = v; kind = 'unit'; }
    } else if (v < 100) { flush(); cur = v; kind = 'tens'; }
    else { flush(); nums.push(v); }
  }
  flush();
  return nums;
}

// ---- game ----
function newQuestion() {
  if (!running) return;
  let key;
  const { min, max, sym } = MODES[mode], pick = () => min + Math.floor(Math.random() * (max - min + 1));
  do { a = pick(); b = pick(); key = mode + a + 'x' + b; } while (key === last);
  last = key;
  const q = $('question');
  q.textContent = `${a} ${sym} ${b} = ?`;
  q.classList.remove('pop'); void q.offsetWidth; q.classList.add('pop');
  $('heard').textContent = '';
  $('feedback').textContent = ''; $('feedback').className = 'feedback';
  locked = false;
}

let pendingTimer = null;

function textFromResult(r) {
  const alts = [];
  for (let i = 0; i < r.length; i++) alts.push(r[i].transcript.trim());
  return alts;
}

function flash(cls) {
  const box = $('qbox');
  box.classList.remove('good', 'bad'); void box.offsetWidth; box.classList.add(cls);
}

function handleResult(alternatives, isFinal) {
  if (locked || !running) return;
  clearTimeout(pendingTimer);
  const answer = answerOf();
  const nums = alternatives.flatMap(parseNumbers);
  if (!nums.length) {
    if (isFinal) $('heard').textContent = `שמעתי: "${alternatives[0]}" – לא הבנתי מספר`;
    return;
  }
  const ok = nums.includes(answer);
  if (ok) return correct();   // the right answer counts the moment it's heard, even mid-sentence
  if (!isFinal) { $('heard').textContent = `אמרת: ${nums[nums.length - 1]}`; return; }
  $('heard').textContent = `אמרת: ${nums[0]}`;
  wrong++; streak = 0; $('streak').textContent = 0;
  const fb = $('feedback');
  fb.textContent = 'טעית, נסה שוב 🙂'; fb.className = 'feedback bad';
  flash('bad');
}

function correct() {
  if (locked || !running) return;
  locked = true;
  clearTimeout(pendingTimer);
  $('heard').textContent = `אמרת: ${answerOf()}`;
  right++; streak++;
  $('right').textContent = right; $('streak').textContent = streak;
  const fb = $('feedback');
  fb.textContent = streak >= 5 ? `מטורף! ${streak} ברצף 🔥` : ['נכון! 🎉','מעולה! ⭐','יפה מאוד! 👏','בול! 🎯'][right % 4];
  fb.className = 'feedback good';
  flash('good');
  const plus = document.createElement('div'); plus.className = 'plus'; plus.textContent = '+1';
  $('qbox').appendChild(plus); setTimeout(() => plus.remove(), 800);
  resetListening();            // drop the rest of this utterance so it can't count against the next question
  setTimeout(newQuestion, 400);
}

function resetListening() { try { rec.abort(); } catch {} }   // onend restarts it right away

function startListening() {
  const r = rec = new SR();
  rec.lang = 'he-IL';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 5;
  rec.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++)
      handleResult(textFromResult(e.results[i]), e.results[i].isFinal);
  };
  rec.onstart = () => $('dot').classList.add('on');
  rec.onend = () => { $('dot').classList.remove('on'); if (running && rec === r) setTimeout(() => { try { r.start(); } catch {} }, 30); };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      stopGame();
      show('intro');
      $('err').textContent = 'אין הרשאה למיקרופון. אשר גישה למיקרופון בדפדפן ונסה שוב.';
    }
  };
  rec.start();
}

// ---- timer ----
function tick() {
  if (!running) return;
  if (isUntimed()) { $('timeText').textContent = '∞'; $('ring').setAttribute('stroke-dashoffset', 0); $('timer').classList.remove('hurry'); return; }
  const left = Math.max(0, endAt - performance.now());
  const secs = Math.ceil(left / 1000);
  $('timeText').textContent = secs;
  $('ring').setAttribute('stroke-dashoffset', RING * (1 - left / (GAME_SECONDS * 1000)));
  $('timer').classList.toggle('hurry', secs <= 10);
  if (left <= 0) return endGame();
}

// keep a phone screen from dimming mid-round
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}

// ---- players who already played on this device (most recent first) ----
function loadPlayers() {
  let list = [];
  try { list = JSON.parse(localStorage.getItem('mult-players') || '[]'); } catch {}
  for (const m in MODES) for (const e of loadBoard(m)) if (!list.includes(e.name)) list.push(e.name);   // older games kept only on the board
  for (const n of FIXED_PLAYERS) if (!list.includes(n)) list.push(n);
  return list;
}
function rememberPlayer(name) {
  const list = [name, ...loadPlayers().filter(n => n !== name)].slice(0, 30);
  try { localStorage.setItem('mult-players', JSON.stringify(list)); } catch {}
}
function playerModes() { try { return JSON.parse(localStorage.getItem('mult-player-mode') || '{}'); } catch { return {}; } }
function setUntimed(u) {
  untimed = u;
  try { localStorage.setItem('mult-untimed', u ? '1' : '0'); } catch {}
  setMode(mode);
}
function setMode(m) {
  mode = m;
  try { localStorage.setItem('mult-mode', m); } catch {}
  document.querySelectorAll('.mode[data-mode]').forEach(btn => btn.classList.toggle('on', btn.dataset.mode === m));
  $('timingBox').hidden = m === 'mul';
  document.querySelectorAll('.timing').forEach(btn => btn.classList.toggle('on', (btn.dataset.untimed === '1') === untimed));
  myEntry = null;
  renderBoard();
  renderPlayers();
}
function renderPlayers() {
  const list = loadPlayers(), box = $('players'), current = $('nameInput').value.trim();
  $('playersBox').hidden = !list.length;
  box.innerHTML = '';
  for (const name of list) {
    const chip = document.createElement('button');
    chip.className = 'chip' + (name === current ? ' on' : '');
    chip.textContent = name;
    chip.onclick = () => {
      $('nameInput').value = name; $('err').textContent = '';
      const saved = playerModes()[name];
      if (saved && typeof saved === 'object') { untimed = !!saved.untimed; setMode(saved.mode); }
      else if (MODES[saved]) setMode(saved); else renderPlayers();
    };
    box.appendChild(chip);
  }
}

let clock = null;
function startClock() { clearInterval(clock); clock = setInterval(tick, 100); tick(); }

function show(id) { for (const s of ['intro', 'game', 'paused', 'result']) $(s).hidden = s !== id; }

function startGame() {
  if (!SR) { $('err').textContent = 'הדפדפן הזה לא תומך בזיהוי קול. פתח את המשחק ב-Google Chrome.'; return; }
  const name = $('nameInput').value.trim();
  if (!name) { $('err').textContent = 'כתוב את השם שלך כדי להיכנס לטבלה 🙂'; $('nameInput').focus(); return; }
  try { localStorage.setItem('mult-name', name); } catch {}
  rememberPlayer(name);
  try { localStorage.setItem('mult-player-mode', JSON.stringify({ ...playerModes(), [name]: { mode, untimed } })); } catch {}
  $('err').textContent = '';
  right = wrong = streak = 0; myEntry = null;
  $('right').textContent = 0; $('streak').textContent = 0;
  renderBoard();
  const top = loadBoard()[0];
  $('finishBtn').hidden = !isUntimed();
  if (isUntimed()) $('target').textContent = '♾️ תרגול בלי זמן – לוחצים "סיימתי" כשרוצים';
  else if (top) { $('target').innerHTML = '🏆 השיא לשבור: <b></b>'; $('target').querySelector('b').textContent = `${top.score} (${top.name})`; }
  else $('target').textContent = '';
  keepAwake(true);
  show('game');
  running = true;
  endAt = performance.now() + GAME_SECONDS * 1000;
  startListening();
  newQuestion();
  startClock();
}

function stopGame() {
  running = false;
  clearInterval(clock);
  keepAwake(false);
  clearTimeout(pendingTimer);
  try { rec.abort(); } catch {}
}

function endGame() {
  stopGame();
  const free = isUntimed();
  const res = free ? { entry: null, place: 0, record: false }
                   : addToBoard(localStorage.getItem('mult-name') || $('nameInput').value.trim(), right);
  $('resultTitle').textContent = free ? 'כל הכבוד! 👏' : 'נגמר הזמן! ⏰';
  $('resultSub').textContent = free ? `תשובות נכונות (טעויות: ${wrong})` : 'תשובות נכונות בדקה';
  myEntry = res.entry;
  renderBoard();
  $('finalScore').textContent = right;
  $('recordMsg').hidden = !res.record;
  $('placeMsg').textContent = free ? 'תרגול בלי זמן – לא נכנס לטבלה' : res.record ? '' : res.place ? `נכנסת לטבלה במקום ${res.place}! 🎉` : 'לא נכנסת לטבלה הפעם – נסה שוב! 💪';
  $('againBtn').textContent = `עוד סיבוב ל${localStorage.getItem('mult-name') || ''}!`;
  show('result');
  if (res.record) confetti(120); else if (res.place) confetti(40);
}

function confetti(n) {
  const colors = ['#ff4f8b','#ff9f1c','#ffc83d','#18c27a','#5b8cff','#8f6bff'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = 2 + Math.random() * 2 + 's';
    c.style.animationDelay = Math.random() * .8 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

// floating numbers in the background
for (let i = 0; i < 14; i++) {
  const n = document.createElement('div');
  n.className = 'bg-num';
  n.textContent = ['×','+','=', 1+Math.floor(Math.random()*100)][i % 4];
  n.style.left = Math.random() * 100 + 'vw';
  n.style.fontSize = 30 + Math.random() * 60 + 'px';
  n.style.animationDuration = 18 + Math.random() * 20 + 's';
  n.style.animationDelay = -Math.random() * 30 + 's';
  document.body.appendChild(n);
}

try { $('nameInput').value = localStorage.getItem('mult-name') || ''; } catch {}
document.querySelectorAll('.mode[data-mode]').forEach(btn => btn.onclick = () => setMode(btn.dataset.mode));
document.querySelectorAll('.timing').forEach(btn => btn.onclick = () => setUntimed(btn.dataset.untimed === '1'));
setMode(mode);
if (location.protocol === 'file:')
  $('err').textContent = 'כדי שהדפדפן לא ישאל על המיקרופון בכל תרגיל – פתח את המשחק דרך הקובץ "הפעל משחק.bat".';
renderBoard();

$('startBtn').onclick = startGame;
$('nameInput').onkeydown = e => { if (e.key === 'Enter') startGame(); };
$('againBtn').onclick = startGame;

// ---- pause / resume / restart ----
let pausedLeft = 0;
function pauseGame() {
  if (!running) return;
  pausedLeft = Math.max(0, endAt - performance.now());
  stopGame();
  $('pausedTime').textContent = Math.ceil(pausedLeft / 1000);
  $('pausedTimeBox').hidden = isUntimed();
  $('pausedScore').textContent = right;
  show('paused');
}
function resumeGame() {
  show('game');
  running = true;
  keepAwake(true);
  endAt = performance.now() + pausedLeft;
  locked = false;
  $('heard').textContent = '';
  startListening();
  startClock();
}
function restartGame() { stopGame(); startGame(); }   // the interrupted round is not saved to the board
$('pauseBtn').onclick = pauseGame;
$('finishBtn').onclick = () => { if (running) endGame(); };
$('resumeBtn').onclick = resumeGame;
$('restartBtn').onclick = restartGame;
$('pausedRestartBtn').onclick = restartGame;
$('menuBtn').onclick = () => { stopGame(); renderPlayers(); show('intro'); };
$('otherBtn').onclick = () => {
  $('nameInput').value = '';
  $('err').textContent = '';
  renderPlayers();
  show('intro');
  $('nameInput').focus();
};
$('nameInput').oninput = renderPlayers;
$('skipBtn').onclick = () => { clearTimeout(pendingTimer); streak = 0; $('streak').textContent = 0; resetListening(); newQuestion(); };
</script>
</body>
</html>
